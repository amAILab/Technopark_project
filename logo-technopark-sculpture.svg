<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Логотип Технопарка РГСУ">
  <defs>
    <clipPath id="logoClip"><circle cx="256" cy="256" r="238"/></clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#eff6ff"/>
  <circle cx="256" cy="256" r="244" fill="#ffffff" filter="url(#softShadow)"/>
  <g clip-path="url(#logoClip)">
    <image x="18" y="18" width="476" height="476" href="data:image/jpeg;base64," preserveAspectRatio="xMidYMid slice"/>
  </g>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#bfdbfe" stroke-width="10"/>
</svg>
