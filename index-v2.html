<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Панель управления проектами Технопарка РГСУ - версия 2.0</title>
  <meta name="description" content="Рабочая версия 2.0 панели управления проектами, грантами, НТС и качеством данных Технопарка РГСУ.">
  <meta name="theme-color" content="#10231d">
  <style>
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top left,#e8f3ee,transparent 34rem),#f5f7f4;color:#13221b;display:grid;place-items:center;min-height:100vh;padding:24px}.box{max-width:820px;background:#fff;border:1px solid #dce5df;border-radius:22px;padding:30px;box-shadow:0 18px 55px rgba(16,35,29,.08)}h1{margin:0 0 10px;font-size:34px;letter-spacing:-.035em}p{color:#66736c;line-height:1.5}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip{border-radius:99px;background:#e2f1ec;color:#0d533f;font-weight:850;font-size:12px;padding:7px 10px}.loader{height:8px;border-radius:99px;background:#edf1ee;overflow:hidden;margin-top:18px}.loader i{display:block;width:45%;height:100%;background:#0f6f52;animation:load 1.2s infinite alternate}.hint{font-size:13px;margin-top:14px}@keyframes load{from{transform:translateX(-80%)}to{transform:translateX(220%)}}
  </style>
</head>
<body>
  <div class="box">
    <h1>Загружается версия 2.0</h1>
    <p>Подключаю текущий реестр проектов, Google Таблицу, Apps Script и модуль управленческих улучшений.</p>
    <div class="chips"><span class="chip">Матрица</span><span class="chip">Качество данных</span><span class="chip">НТС</span><span class="chip">Отчет</span><span class="chip">Календарь</span><span class="chip">Проблемы</span></div>
    <div class="loader"><i></i></div>
    <p class="hint">Эта страница не ломает основной сайт: она загружает текущий index.html и подключает improvements.js поверх него.</p>
  </div>
  <script>
    async function boot(){
      try{
        const response = await fetch('index.html', { cache: 'no-store' });
        let html = await response.text();
        if (!html.includes('improvements.js')) {
          html = html.replace('</body>', '<script src="improvements.js"><\\/script>\n</body>');
        }
        html = html.replace('<title>Реестр проектов и грантов - Технопарк РГСУ</title>', '<title>Панель управления проектами Технопарка РГСУ - версия 2.0</title>');
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        document.body.innerHTML = '<div class="box"><h1>Не удалось загрузить версию 2.0</h1><p>Откройте index.html и добавьте перед закрывающим тегом body строку: &lt;script src="improvements.js"&gt;&lt;/script&gt;</p></div>';
      }
    }
    boot();
  </script>
</body>
</html>
